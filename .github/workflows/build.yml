name: Build

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore WinLaunch.sln

      - name: Build
        run: dotnet build WinLaunch.sln -c Release --no-restore

      - name: Test
        run: dotnet test WinLaunch.Tests\WinLaunch.Tests.csproj -c Release --no-build
